name: CI
on:
  pull_request:

concurrency:
  group: luminaf-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://cgigviwpnvlidguhspnf.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_BASE_PATH: /luminaf
      - uses: denoland/setup-deno@v2
      - run: deno install
      - run: deno check supabase/functions/push-dispatch/index.ts\n      - run: deno check supabase/functions/api-gateway/index.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
