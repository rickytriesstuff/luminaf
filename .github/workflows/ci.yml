name: CI
on:
  pull_request:
  push:
    branches: [main, feat/cloudflare-workers-deployment]

concurrency:
  group: luminaf-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@v2
      - run: deno install
      - run: deno check supabase/functions/push-dispatch/index.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
