name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Also apply pending SQL migrations (requires SUPABASE_DB_PASSWORD)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy Edge Functions
        run: |
          npx --yes supabase@latest functions deploy api-gateway --project-ref cgigviwpnvlidguhspnf
          npx --yes supabase@latest functions deploy push-dispatch --project-ref cgigviwpnvlidguhspnf
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Apply pending database migrations (manual opt-in only)
        if: ${{ inputs.apply_migrations == true }}
        run: |
          npx --yes supabase@latest link --project-ref cgigviwpnvlidguhspnf --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@latest db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
